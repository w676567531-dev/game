<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搅拌设备智能组装系统</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .main-container { display: flex; max-width: 1300px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; height: 90vh; }
        
        /* 左侧控制区 */
        .control-panel { width: 45%; padding: 25px; background: #ffffff; border-right: 2px dashed #e2e8f0; overflow-y: auto; position: relative;}
        
        .material-selector { display: flex; gap: 8px; margin-bottom: 20px; background: #f8fafc; padding: 10px; border-radius: 10px; border: 2px dashed #cbd5e1; }
        .mat-btn { flex: 1; padding: 10px 5px; background: white; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; color: #64748b; transition: all 0.2s; text-align: center;}
        .mat-btn.active { background: #0ea5e9; color: white; border-color: #0284c7; box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3); }
        .mat-btn.free { background: #8b5cf6; color: white; border-color: #6d28d9; }
        
        .task-desc { font-size: 15px; color: #475569; margin-bottom: 15px; background: #fffbeb; padding: 12px; border-radius: 8px; border-left: 4px solid #f59e0b; display: none; }
        .task-desc.show { display: block; }

        .step-title { font-size: 18px; font-weight: bold; color: #0ea5e9; margin-bottom: 8px; display: flex; align-items: center; }
        .step-title span { background: #0ea5e9; color: white; border-radius: 50%; width: 24px; height: 24px; display: inline-flex; justify-content: center; align-items: center; margin-right: 8px; font-size: 14px; }
        
        .option-group { display: flex; flex-direction: row; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; transition: opacity 0.3s; }
        .option-group .btn-option { flex: 1; min-width: 45%; }
        
        .btn-option { background: #f8fafc; border: 2px solid #cbd5e1; padding: 8px 10px; border-radius: 8px; font-size: 15px; cursor: pointer; text-align: center; transition: all 0.2s; font-weight: bold; color: #475569; line-height: 1.3;}
        .btn-option:hover:not(:disabled) { border-color: #0ea5e9; background: #f0f9ff; }
        .btn-option.selected { background: #0ea5e9; color: white; border-color: #0284c7; box-shadow: 0 4px 10px rgba(14, 165, 233, 0.4); }
        .btn-option:disabled { opacity: 0.3; pointer-events: none; background: #e2e8f0; }
        
        /* 右侧展示区 */
        .display-panel { width: 55%; background: #e0f2fe; position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 50px; overflow: hidden; }
        
        /* 搅拌罐容器 */
        .tank { width: 300px; height: 380px; position: relative; display: flex; justify-content: center; perspective: 800px; }
        
        /* 罐底与罐身 */
        .tank-body { width: 100%; height: 300px; border: 6px solid #64748b; border-top: none; background: rgba(255,255,255,0.2); position: absolute; bottom: 0; transition: all 0.5s ease; z-index: 2;}
        .tank-body.round-bottom { border-radius: 0 0 100px 100px; }
        .tank-body.flat-bottom { border-radius: 0 0 10px 10px; }
        
        .tank-lid { width: 100%; height: 15px; background: #64748b; position: absolute; top: 65px; border-radius: 5px; opacity: 0; transition: opacity 0.5s; z-index: 3;}
        .tank-lid.show { opacity: 1; }
        
        .baffle { position: absolute; width: 6px; background: #94a3b8; bottom: 0; opacity: 0; transition: all 0.5s; z-index: 1;}
        .baffle.left { left: 25px; }
        .baffle.right { right: 25px; }
        .baffle.show { opacity: 1; }
        
        .shaft { position: absolute; background: #475569; opacity: 0; transition: opacity 0.5s; z-index: 4; }
        .shaft.show { opacity: 1; }
        
        .impeller { position: absolute; opacity: 0; transition: opacity 0.5s, transform 0.5s, width 0.3s, height 0.3s; z-index: 5; display: flex; justify-content: center; align-items: center; transform-style: preserve-3d; }
        .impeller.show { opacity: 1; }
        
        .blade-propeller { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;}
        .blade-propeller::before, .blade-propeller::after { content: ''; width: 40%; height: 15px; background: #ef4444; position: absolute; border-radius: 10px;}
        .blade-propeller::before { left: 0; transform: rotate(15deg); }
        .blade-propeller::after { right: 0; transform: rotate(-15deg); }

        .blade-turbine { width: 100%; height: 100%; border: 6px solid #ef4444; border-radius: 50%; position: relative; background: rgba(255,255,255,0.1);}
        .blade-turbine::after { content: ''; position: absolute; width: 100%; height: 6px; background: #ef4444; top: 50%; left: 0; transform: translateY(-50%); }

        .blade-anchor { width: 100%; height: 100%; border: 6px solid #3b82f6; border-top: none; border-radius: 0 0 50% 50%; position: absolute; bottom: 0; left: 0; box-sizing: border-box;} 
        .blade-anchor::before { content: ''; position: absolute; width: 100%; height: 6px; background: #3b82f6; top: 0; left: 0; }

        .blade-screw { width: 100%; height: 100%; border: 6px solid #8b5cf6; border-radius: 50%; position: relative; box-sizing: border-box; }
        .blade-screw::before { content: ''; position: absolute; top: 10%; bottom: 10%; left: 10%; right: 10%; border: 2px dashed #8b5cf6; border-radius: 50%; }

        .liquid { position: absolute; bottom: 0; width: 100%; height: 0%; background: rgba(14, 165, 233, 0.4); transition: height 1s, background-color 0.5s, border-radius 0.5s; border-radius: 0; z-index: 1; overflow: hidden;}
        .particle { position: absolute; width: 8px; height: 8px; background: #facc15; border-radius: 50%; opacity: 0; z-index: 6; pointer-events: none; }
        
        .action-btn { background: #10b981; color: white; border: none; padding: 15px 40px; font-size: 20px; border-radius: 30px; cursor: pointer; box-shadow: 0 6px 0 #047857; font-weight: bold; position: absolute; top: 30px; right: 30px; display: none; z-index: 10;}
        .action-btn:hover { background: #34d399; transform: translateY(-2px); box-shadow: 0 8px 0 #047857; }
        .action-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #047857; }
        
        .reset-btn { background: #f59e0b; top: 30px; right: 220px; box-shadow: 0 6px 0 #b45309; display: none;}
        .reset-btn:hover { background: #fbbf24; box-shadow: 0 8px 0 #b45309;}
        .reset-btn:active { box-shadow: 0 2px 0 #b45309;}

        /* 桨叶 3D 旋转 */
        @keyframes spin3D { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
        @keyframes spinSide { 0% { transform: rotateY(90deg) rotateZ(0deg); } 100% { transform: rotateY(90deg) rotateZ(360deg); } }
        @keyframes spinPropellerHorizontal {
            0% { transform: perspective(320px) rotateX(68deg) rotateZ(0deg); }
            100% { transform: perspective(320px) rotateX(68deg) rotateZ(360deg); }
        }

        /* 物料流型 */
        @keyframes axialFlow {
            0% { transform: translate(-50%, 0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            45% { transform: translate(-50%, 0) translate(calc(var(--up-x) + var(--mix-x)), -180px); opacity: 1; }
            75% { transform: translate(-50%, 0) translate(calc(var(--down-x) + var(--mix-x)), -180px); opacity: 0.8; }
            100% { transform: translate(-50%, 0) translate(var(--down-x), 0); opacity: 0; }
        }
        @keyframes radialFlow {
            0% { transform: translate(-50%, 0) translateX(0); opacity: 0; }
            15% { opacity: 1; }
            50% { transform: translate(-50%, 0) translate(var(--out-x), var(--mix-y)); opacity: 1; }
            100% { transform: translate(-50%, 0) translate(calc(var(--out-x) * 0.8), var(--in-y)); opacity: 0; }
        }
        @keyframes wrongSwirl {
            0% { transform: translate(-50%, 0) rotate(0deg) translateX(50px) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translate(-50%, 0) rotate(360deg) translateX(50px) rotate(-360deg); opacity: 0; }
        }
        @keyframes juiceCirculation {
            0% { transform: translate(0, 0) rotate(0); opacity: 0; }
            12% { opacity: .9; }
            42% { transform: translate(var(--jx1), -145px) rotate(180deg); opacity: 1; }
            70% { transform: translate(var(--jx2), -205px) rotate(270deg); opacity: .82; }
            100% { transform: translate(var(--jx3), -20px) rotate(540deg); opacity: 0; }
        }
        @keyframes syrupFold {
            0% { transform: translate(0, 0) scaleX(.55) rotate(-8deg); opacity: .15; }
            30% { transform: translate(var(--sx1), -52px) scaleX(1.5) rotate(16deg); opacity: .72; }
            65% { transform: translate(var(--sx2), -105px) scaleX(.75) rotate(-12deg); opacity: .9; }
            100% { transform: translate(var(--sx3), -18px) scaleX(1.2) rotate(8deg); opacity: .1; }
        }
        @keyframes proteinBubble {
            0% { transform: translate(0, 0) scale(.45); opacity: 0; }
            15% { opacity: .78; }
            65% { transform: translate(var(--px1), -145px) scale(1); opacity: .8; }
            100% { transform: translate(var(--px2), -220px) scale(1.3); opacity: 0; }
        }
        @keyframes liquidShimmer { to { background-position: 70px 0, 0 0; } }
        @keyframes juiceSurface {
            0%, 100% { transform: translateX(-2%) rotate(-1deg) scaleX(1.03); }
            50% { transform: translateX(2%) rotate(1.2deg) scaleX(.98); }
        }
        @keyframes syrupSurface {
            0%, 100% { transform: scaleY(.8) translateY(2px); }
            50% { transform: scaleY(1.18) translateY(-2px); }
        }
        @keyframes foamDrift {
            0%, 100% { transform: translateX(-3%); opacity: .86; }
            50% { transform: translateX(3%); opacity: 1; }
        }

        /* 更接近真实工业设备的材质、结构与空间光影 */
        * { box-sizing: border-box; }
        body {
            min-height: 100vh; padding: 18px; color: #1f2937;
            background: radial-gradient(circle at 20% 10%, #fff, transparent 32%), linear-gradient(135deg, #dbe3e9, #b9c5ce);
        }
        .main-container {
            max-width: 1420px; height: calc(100vh - 36px); min-height: 720px; border-radius: 14px;
            border: 1px solid rgba(255,255,255,.75);
            box-shadow: 0 24px 60px rgba(30,41,59,.22), inset 0 1px 0 #fff;
        }
        .control-panel { width: 43%; padding: 28px 30px; border-right: 1px solid #cbd5e1; background: linear-gradient(#fff, #f8fafc); }
        .material-selector { padding: 6px; border: 1px solid #d8e0e7; border-radius: 9px; background: #eef2f5; box-shadow: inset 0 1px 3px #00000012; }
        .mat-btn, .btn-option { border-width: 1px; border-radius: 6px; }
        .mat-btn.active, .btn-option.selected {
            background: linear-gradient(#1596c8, #0879a8); border-color: #056b96;
            box-shadow: 0 3px 8px #0879a83d, inset 0 1px #ffffff40;
        }
        .mat-btn.free { background: linear-gradient(#7764ca, #5b46ad); border-color: #503c9e; }
        .step-title { color: #334155; font-size: 16px; }
        .step-title span { background: linear-gradient(145deg, #64748b, #334155); box-shadow: inset 0 1px #ffffff59; }
        .btn-option { background: linear-gradient(#fff, #eef2f5); border-color: #cbd5df; color: #3e4c5d; box-shadow: 0 1px 2px #0f172a0f; }
        .display-panel {
            width: 57%; padding-bottom: 72px;
            background:
                linear-gradient(#ffffff24 1px, transparent 1px), linear-gradient(90deg, #ffffff24 1px, transparent 1px),
                radial-gradient(ellipse at 50% 35%, #f6fafc, #d7e0e6 48%, #aab7c1);
            background-size: 28px 28px, 28px 28px, auto;
        }
        .display-panel::before {
            content: ''; position: absolute; inset: auto 0 0; height: 105px; z-index: 0;
            background: linear-gradient(#8d9aa4, #67747e); border-top: 2px solid #ffffffcc;
            box-shadow: inset 0 18px 30px #ffffff1f;
        }
        .display-title { position: absolute; top: 24px; left: 28px; z-index: 9; }
        .display-title strong { display: block; color: #263746; font-size: 19px; letter-spacing: 1px; }
        .display-title small { display: block; margin-top: 5px; color: #667785; font-size: 12px; }
        .status-pill {
            display: inline-flex; align-items: center; gap: 7px; margin-top: 10px; padding: 6px 10px;
            border: 1px solid #64748b59; border-radius: 999px; background: #ffffffad; color: #475569; font-size: 12px;
        }
        .status-pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px #22c55e29; }
        .tank { width: 320px; height: 380px; filter: drop-shadow(18px 18px 13px #1e293b40); }
        .tank::after { content: ''; position: absolute; left: 36px; right: 36px; bottom: -58px; height: 24px; border-radius: 50%; background: #0f172a45; filter: blur(8px); }
        .tank-body {
            height: 300px; border: 5px solid #7f8d96; border-top: 4px solid #aab6bd; overflow: hidden;
            background: linear-gradient(90deg, #5868729e, #e2eaeead 8%, #ffffff4d 24%, #94a3ad33 52%, #ffffff6e 74%, #5a69729e);
            box-shadow: inset 14px 0 18px #ffffff59, inset -14px 0 20px #1e293b24, 0 2px 2px #ffffffcc;
        }
        .tank-body::before {
            content: ''; position: absolute; top: -10px; left: -5px; width: calc(100% + 10px); height: 20px; z-index: 8;
            border: 5px solid #77858e; border-radius: 50%; background: linear-gradient(#dbe2e6, #818f98 52%, #dfe6ea);
            box-shadow: inset 0 2px 3px #ffffffbf, 0 3px 4px #0f172a29;
        }
        .tank-body::after {
            content: ''; position: absolute; top: 28px; bottom: 42px; left: 28px; width: 9px; z-index: 7;
            border-radius: 8px; background: linear-gradient(90deg, #ffffff1a, #ffffffb8, #ffffff14); opacity: .72;
        }
        .tank-body.round-bottom { border-radius: 2px 2px 112px 112px / 2px 2px 76px 76px; }
        .tank-body.flat-bottom { border-radius: 2px 2px 8px 8px; }
        .tank-lid {
            top: 66px; width: 108%; height: 18px; border: 1px solid #65737c; border-radius: 50%;
            background: linear-gradient(#e7ecef, #9aa7af 45%, #65737d 55%, #cbd4d9);
            box-shadow: 0 5px 8px #0f172a3d, inset 0 2px 2px #ffffffcc;
        }
        .liquid {
            left: 3%; bottom: 5px; width: 94%;
            background: linear-gradient(90deg, #0284c78f, #7dd3fc5c 42%, #0369a18c);
            box-shadow: inset 0 10px 18px #ffffff40;
        }
        .liquid::before { content: ''; position: absolute; top: -7px; width: 100%; height: 14px; border-radius: 50%; background: #7dd3fcb8; box-shadow: inset 0 3px 4px #ffffff8c; }
        .liquid::after { content: ''; position: absolute; pointer-events: none; opacity: 0; }
        .liquid.material-free {
            background: linear-gradient(90deg, #0284c78f, #7dd3fc5c 42%, #0369a18c);
        }
        .liquid.material-juice {
            background:
                linear-gradient(90deg, #d9770699, #fbbf2475 42%, #ea580c99),
                repeating-linear-gradient(115deg, transparent 0 14px, #fff3 15px 16px);
        }
        .liquid.material-juice::before { background: #fbbf24cc; box-shadow: inset 0 3px 5px #fff8, 0 2px 5px #92400e4d; }
        .liquid.material-syrup {
            background:
                radial-gradient(ellipse at 30% 40%, #f59e0b66, transparent 35%),
                linear-gradient(90deg, #78350fd9, #d97706bd 42%, #71310dde);
            box-shadow: inset 0 12px 22px #fef3c74d, inset 0 -18px 30px #451a0359;
        }
        .liquid.material-syrup::before { height: 12px; top: -6px; background: #b45309e8; box-shadow: inset 0 3px 4px #fde68a75; }
        .liquid.material-protein {
            background:
                radial-gradient(circle at 35% 25%, #ffffff91 0 3px, transparent 4px),
                linear-gradient(90deg, #d8e6dfa8, #fffdf0d9 45%, #c8ddd4b8);
            background-size: 34px 32px, auto;
            box-shadow: inset 0 12px 22px #fff9, inset 0 -15px 28px #94a3b84d;
        }
        .liquid.material-protein::before { background: #f8faf0e8; box-shadow: inset 0 3px 4px #fff, 0 2px 6px #64748b38; }
        .liquid.material-protein::after {
            left: 0; top: -2px; width: 100%; height: 26px; opacity: .9;
            background:
                radial-gradient(circle at 8px 8px, #fff 0 5px, #dbe7df 6px, transparent 7px),
                radial-gradient(circle at 24px 12px, #fff 0 7px, #dbe7df 8px, transparent 9px);
            background-size: 35px 22px, 44px 25px;
        }
        .liquid.running { animation: liquidShimmer 2.2s linear infinite; }
        .liquid.material-juice.running::before { animation: juiceSurface .72s ease-in-out infinite; }
        .liquid.material-syrup.running::before { animation: syrupSurface 2.8s ease-in-out infinite; }
        .liquid.material-protein.running::before, .liquid.material-protein.running::after { animation: foamDrift 2.4s ease-in-out infinite; }
        .particle.juice-pulp {
            width: 7px; height: 3px; border-radius: 70% 20%;
            background: linear-gradient(90deg, #fff3, #fde047, #f97316);
            box-shadow: 0 0 3px #f59e0b;
        }
        .particle.syrup-strand {
            width: 18px; height: 5px; border-radius: 50%;
            background: linear-gradient(90deg, transparent, #fbbf24b8, #ffedd5e6, #92400eb3);
            filter: blur(.2px); box-shadow: 0 1px 4px #451a0373;
        }
        .particle.protein-bubble {
            width: var(--bubble-size); height: var(--bubble-size); background: #ffffff24;
            border: 1.5px solid #ffffffe6; box-shadow: inset 1px 1px 2px #fff, 0 0 3px #64748b4d;
        }
        .baffle { width: 9px; border: 1px solid #71808a; border-radius: 3px; background: linear-gradient(90deg, #687781, #dce4e8 46%, #7a8992); box-shadow: 2px 2px 4px #0f172a33; z-index: 4; }
        .baffle.left { left: 31px; } .baffle.right { right: 31px; }
        .shaft { border: 1px solid #687780; border-radius: 4px; background: linear-gradient(90deg, #66747d, #e7edf0 38%, #88969f 68%, #52616a); box-shadow: 2px 2px 4px #0f172a40; }
        .drive-assembly { position: absolute; top: -5px; left: 50%; width: 62px; height: 76px; transform: translateX(-50%); z-index: 6; opacity: 0; transition: all .45s; }
        .drive-assembly.show { opacity: 1; } .drive-assembly.top-off { left: 35%; }
        .drive-assembly.bottom { top: auto; bottom: -42px; transform: translateX(-50%) rotate(180deg); }
        .drive-assembly.side { top: 211px; left: -53px; transform: rotate(-90deg); }
        .motor {
            position: absolute; top: 0; left: 8px; width: 46px; height: 48px; border: 2px solid #355f63; border-radius: 8px 8px 5px 5px;
            background: repeating-linear-gradient(90deg, #477b7f 0 4px, #5f9698 4px 7px); box-shadow: inset 0 2px 2px #ffffff40, 3px 4px 7px #0f172a40;
        }
        .motor::before { content: ''; position: absolute; top: -7px; left: 12px; width: 20px; height: 7px; border-radius: 4px 4px 0 0; background: #3e676a; }
        .gearbox { position: absolute; left: 4px; bottom: 0; width: 54px; height: 25px; border: 2px solid #6a7780; border-radius: 6px; background: linear-gradient(145deg, #d8e0e4, #87949c); box-shadow: inset 0 2px 2px #ffffff80; }
        .impeller { filter: drop-shadow(3px 5px 4px #0f172a55); }
        .impeller-spin { overflow: visible; }
        .impeller-svg { width: 100%; height: 100%; overflow: visible; }
        .impeller-svg .metal-edge { stroke: #586771; stroke-width: 2.2; stroke-linejoin: round; }
        .impeller-svg .highlight { fill: none; stroke: #ffffffa8; stroke-width: 2; stroke-linecap: round; }
        .impeller-svg .shadow-line { fill: none; stroke: #44535d; stroke-width: 2; stroke-linecap: round; opacity: .72; }
        .impeller-svg .hub { fill: url(#hubMetal); stroke: #4d5d67; stroke-width: 2; }
        .impeller-svg .shaft-socket { fill: url(#darkMetal); stroke: #46545d; stroke-width: 2; }
        .blade-propeller, .blade-turbine, .blade-screw, .blade-anchor {
            width: 100%; height: 100%; position: relative; border: 0; background: none;
        }
        .blade-propeller::before, .blade-propeller::after,
        .blade-turbine::after, .blade-screw::before, .blade-anchor::before { content: none; }
        .blade-propeller .blade-face { fill: url(#bladeMetal); stroke: #53616b; stroke-width: 2; }
        .blade-propeller .blade-back { fill: url(#bladeDark); stroke: #485762; stroke-width: 2; }
        .blade-turbine .disc { fill: url(#discMetal); stroke: #52616a; stroke-width: 2; }
        .blade-turbine .vane { fill: url(#vaneMetal); stroke: #4c5a63; stroke-width: 1.8; }
        .blade-screw .ribbon-front { fill: none; stroke: url(#ribbonMetal); stroke-width: 17; stroke-linecap: round; }
        .blade-screw .ribbon-back { fill: none; stroke: #60707a; stroke-width: 14; stroke-linecap: round; opacity: .62; }
        .blade-screw .brace { stroke: #85939b; stroke-width: 7; stroke-linecap: round; }
        .blade-anchor .anchor-frame { fill: none; stroke: url(#anchorMetal); stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
        .blade-anchor .anchor-inner { fill: none; stroke: #edf2f4a8; stroke-width: 2.5; stroke-linecap: round; }
        .blade-anchor .scraper { fill: url(#scraperMetal); stroke: #52616a; stroke-width: 2; }
        .tank-leg { position: absolute; bottom: -48px; width: 22px; height: 64px; border: 2px solid #66747d; background: linear-gradient(90deg, #6e7c84, #d5dde1 45%, #73818a); z-index: 1; }
        .tank-leg.left { left: 55px; transform: skewX(-8deg); } .tank-leg.right { right: 55px; transform: skewX(8deg); }
        .tank-leg::after { content: ''; position: absolute; left: -9px; bottom: -4px; width: 38px; height: 7px; border-radius: 3px; background: #596872; }
        .outlet { position: absolute; left: 50%; bottom: -22px; width: 34px; height: 30px; transform: translateX(-50%); border: 2px solid #65737c; background: linear-gradient(90deg, #718089, #d3dce1 50%, #67757e); z-index: 3; }
        .outlet::after { content: ''; position: absolute; left: -7px; bottom: -7px; width: 44px; height: 9px; border-radius: 3px; background: #63717a; }
        .action-btn { top: 26px; padding: 11px 22px; border: 1px solid #00000029; border-radius: 7px; background: linear-gradient(#2da76f, #177c50); box-shadow: 0 3px 0 #0e5c3a, 0 7px 14px #0f172a2e; font-size: 16px; }
        .reset-btn { right: 190px; background: linear-gradient(#d69b34, #ad6b13); box-shadow: 0 3px 0 #7f4b0b, 0 7px 14px #0f172a2e; }
        @media (max-width: 1000px) {
            body { padding: 0; } .main-container { height: auto; min-height: 100vh; border-radius: 0; flex-direction: column; }
            .control-panel, .display-panel { width: 100%; } .display-panel { min-height: 600px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="control-panel">
        <div style="margin-bottom: 20px;">
            <h1 style="color: #1e293b; margin: 0; font-size: 24px;">⚙️ 搅拌设备智能组装</h1>
        </div>

        <div class="material-selector">
            <button class="mat-btn free active" onclick="setMaterial('free', this)">自由探索</button>
            <button class="mat-btn" onclick="setMaterial('juice', this)">物料A：果汁</button>
            <button class="mat-btn" onclick="setMaterial('syrup', this)">物料B：糖浆</button>
            <button class="mat-btn" onclick="setMaterial('protein', this)">物料C：蛋白液</button>
        </div>

        <div class="task-desc" id="taskDesc"></div>

        <div class="step-title"><span>1</span> 选择容器底部</div>
        <div class="option-group" id="step1">
            <button class="btn-option" onclick="selectOption('step1', 'round', this)">半球形底 (U型)</button>
            <button class="btn-option" onclick="selectOption('step1', 'flat', this)">直角形底</button>
        </div>

        <div class="step-title"><span>2</span> 是否添加挡板</div>
        <div class="option-group" id="step2">
            <button class="btn-option" onclick="selectOption('step2', 'yes', this)">添加挡板</button>
            <button class="btn-option" onclick="selectOption('step2', 'no', this)">不加挡板</button>
        </div>

        <div class="step-title"><span>3</span> 罐体形式</div>
        <div class="option-group" id="step3">
            <button class="btn-option" onclick="selectOption('step3', 'open', this)">无上盖</button>
            <button class="btn-option" onclick="selectOption('step3', 'closed', this)">有上盖</button>
        </div>

        <div class="step-title"><span>4</span> 搅拌器进入方式</div>
        <div class="option-group" id="step4">
            <button class="btn-option" onclick="selectOption('step4', 'top', this)">上植入式(中心)</button>
            <button class="btn-option" onclick="selectOption('step4', 'top-off', this)">上植入式(偏心)</button>
            <button class="btn-option" onclick="selectOption('step4', 'bottom', this)">下植入式</button>
            <button class="btn-option" onclick="selectOption('step4', 'side', this)">旁入式</button>
        </div>

        <div class="step-title"><span>5</span> 选择叶片大小</div>
        <div class="option-group" id="step5">
            <button class="btn-option" onclick="selectBladeSize('small', this)">中小叶片 (低粘度)</button>
            <button class="btn-option" onclick="selectBladeSize('large', this)">大叶片 (高粘度)</button>
        </div>

        <div class="step-title"><span>6</span> 选择桨叶形状</div>
        <div class="option-group" id="step6">
            <button class="btn-option" id="btn-propeller" onclick="selectBladeShape('propeller', this)" disabled>推进式旋桨</button>
            <button class="btn-option" id="btn-turbine" onclick="selectBladeShape('turbine', this)" disabled>涡轮式</button>
            <button class="btn-option" id="btn-screw" onclick="selectBladeShape('screw', this)" disabled>垂直螺旋式(螺带)</button>
            <button class="btn-option" id="btn-anchor" onclick="selectBladeShape('anchor', this)" disabled>框式/锚式</button>
        </div>

        <div class="step-title"><span>7</span> 选择叶片直径比例 (D/T)</div>
        <div class="option-group" id="step7">
            <button class="btn-option" onclick="selectOption('step7', 'small', this)">0.2 ~ 0.4 (中小直径)</button>
            <button class="btn-option" onclick="selectOption('step7', 'medium', this)">0.8 ~ 0.9 (大直径/贴壁)</button>
            <button class="btn-option" onclick="selectOption('step7', 'large', this)">0.9 ~ 0.95 (超大/贴壁)</button>
        </div>
    </div>

    <div class="display-panel">
        <div class="display-title">
            <strong>搅拌釜装配预览</strong>
            <small>STAINLESS STEEL MIXING VESSEL · 结构示意</small>
            <div class="status-pill" id="statusText">等待设备选型</div>
        </div>
        <button class="action-btn reset-btn" id="resetBtn" onclick="resetGame()">重新组装</button>
        <button class="action-btn" id="startBtn" onclick="startSimulation()">▶ 启动演示</button>

        <div class="tank" id="tank">
            <div class="drive-assembly" id="driveAssembly">
                <div class="motor"></div>
                <div class="gearbox"></div>
            </div>
            <div class="liquid material-free" id="liquid"></div>
            <div class="tank-body" id="tankBody"></div>
            <div class="tank-lid" id="tankLid"></div>
            
            <div class="baffle left" id="baffleL"></div>
            <div class="baffle right" id="baffleR"></div>
            
            <div class="shaft" id="shaft"></div>
            <div class="impeller" id="impeller">
                <div class="impeller-spin" id="impellerSpin" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; transform-style: preserve-3d;"></div>
            </div>
            <div class="tank-leg left"></div>
            <div class="tank-leg right"></div>
            <div class="outlet"></div>
        </div>
    </div>
</div>

<script>
    let currentMode = 'free'; 
    let userChoices = {
        bottom: null, baffle: null, lid: null, entry: null, 
        bladeSize: null, bladeShape: null, diameter: null
    };

    const materials = {
        free: { desc: "" },
        juice: { desc: "【场景A：果汁】低粘度，需大循环混匀。U型底+加挡板消打旋+密闭上盖+中心顶入+中小叶片(旋桨)+D/T 0.2~0.4。" },
        syrup: { desc: "【场景B：糖浆】高粘度，需刮壁防焦化。U型底+不需挡板+密闭上盖+中心顶入+大叶片(锚/框或螺带)+大直径(贴壁)。" },
        protein: { desc: "【场景C：蛋白液】易起泡，需温和剪切。U型底+慎用挡板+密闭上盖+顶入式(偏心)+中小叶片(旋桨)+D/T 0.2~0.4。" }
    };

    function setMaterial(mode, btn) {
        currentMode = mode;
        document.querySelectorAll('.mat-btn').forEach(b => b.classList.remove('active', 'free'));
        btn.classList.add('active');
        if(mode === 'free') btn.classList.add('free');
        const descEl = document.getElementById('taskDesc');
        if(mode === 'free') { descEl.classList.remove('show'); } else { descEl.innerText = materials[mode].desc; descEl.classList.add('show'); }
        resetGame();
    }

    function selectOption(stepId, value, btnElement) {
        const group = document.getElementById(stepId);
        group.querySelectorAll('.btn-option').forEach(b => b.classList.remove('selected'));
        btnElement.classList.add('selected');

        if (stepId === 'step1') userChoices.bottom = value;
        if (stepId === 'step2') userChoices.baffle = value;
        if (stepId === 'step3') userChoices.lid = value;
        if (stepId === 'step4') userChoices.entry = value;
        if (stepId === 'step7') userChoices.diameter = value;

        updateImage();
        checkCanStart();
    }

    function selectBladeSize(size, btnElement) {
        userChoices.bladeSize = size;
        const group5 = document.getElementById('step5');
        group5.querySelectorAll('.btn-option').forEach(b => b.classList.remove('selected'));
        btnElement.classList.add('selected');

        userChoices.bladeShape = null;
        document.getElementById('impellerSpin').innerHTML = '';
        
        const btnProp = document.getElementById('btn-propeller');
        const btnTurb = document.getElementById('btn-turbine');
        const btnScrew = document.getElementById('btn-screw');
        const btnAnchor = document.getElementById('btn-anchor');
        
        document.querySelectorAll('#step6 .btn-option').forEach(b => b.classList.remove('selected'));

        if (size === 'small') {
            btnProp.disabled = false; btnTurb.disabled = false;
            btnScrew.disabled = true; btnAnchor.disabled = true;
        } else {
            btnProp.disabled = true; btnTurb.disabled = true;
            btnScrew.disabled = false; btnAnchor.disabled = false;
        }
        updateImage();
        checkCanStart();
    }

    function selectBladeShape(shape, btnElement) {
        userChoices.bladeShape = shape;
        const group6 = document.getElementById('step6');
        group6.querySelectorAll('.btn-option').forEach(b => b.classList.remove('selected'));
        btnElement.classList.add('selected');
        updateImage();
        checkCanStart();
    }

    function checkCanStart() {
        if (userChoices.bottom && userChoices.baffle && userChoices.lid && userChoices.entry && userChoices.bladeSize && userChoices.bladeShape && userChoices.diameter) {
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('resetBtn').style.display = 'block';
        }
    }

    function updateImage() {
        const tankBody = document.getElementById('tankBody');
        const tankLid = document.getElementById('tankLid');
        const baffleL = document.getElementById('baffleL');
        const baffleR = document.getElementById('baffleR');
        const shaft = document.getElementById('shaft');
        const impeller = document.getElementById('impeller');
        const impellerSpin = document.getElementById('impellerSpin');
        const liquid = document.getElementById('liquid');
        const driveAssembly = document.getElementById('driveAssembly');
        const statusText = document.getElementById('statusText');

        if (userChoices.bottom === 'round') { tankBody.className = 'tank-body round-bottom'; liquid.style.borderRadius = '0 0 94px 94px'; }
        else if (userChoices.bottom === 'flat') { tankBody.className = 'tank-body flat-bottom'; liquid.style.borderRadius = '0 0 4px 4px'; }

        if (userChoices.baffle === 'yes') { 
            baffleL.classList.add('show'); baffleR.classList.add('show'); 
            if(userChoices.bottom === 'round') { baffleL.style.height = '140px'; baffleR.style.height = '140px'; baffleL.style.bottom = '50px'; baffleR.style.bottom = '50px'; }
            else { baffleL.style.height = '210px'; baffleR.style.height = '210px'; baffleL.style.bottom = '0'; baffleR.style.bottom = '0'; }
        } else { baffleL.classList.remove('show'); baffleR.classList.remove('show'); }

        if (userChoices.lid === 'closed') tankLid.classList.add('show'); else tankLid.classList.remove('show');

        let shaftHeight = 0; let impLeft = '50%'; let impBottom = '0';
        impeller.style.animation = 'none'; impellerSpin.style.animation = 'none'; impellerSpin.style.transform = 'none';

        // 修复了偏心安装的逻辑
        if (userChoices.entry === 'top') {
            driveAssembly.className = 'drive-assembly show';
            shaftHeight = 200; shaft.style.cssText = `top: 80px; left: 50%; transform: translateX(-50%); width: 12px; height: ${shaftHeight}px; bottom: auto; display: block; opacity: 1;`;
            impBottom = 380 - 80 - shaftHeight; impLeft = '50%';
        } else if (userChoices.entry === 'top-off') {
            driveAssembly.className = 'drive-assembly show top-off';
            shaftHeight = 200; shaft.style.cssText = `top: 80px; left: 35%; transform: translateX(-50%); width: 12px; height: ${shaftHeight}px; bottom: auto; display: block; opacity: 1;`;
            impBottom = 380 - 80 - shaftHeight; impLeft = '35%';
        } else if (userChoices.entry === 'bottom') {
            driveAssembly.className = 'drive-assembly show bottom';
            shaftHeight = 140; shaft.style.cssText = `bottom: 0; left: 50%; transform: translateX(-50%); width: 12px; height: ${shaftHeight}px; top: auto; display: block; opacity: 1;`;
            impBottom = shaftHeight; impLeft = '50%';
        } else if (userChoices.entry === 'side') {
            driveAssembly.className = 'drive-assembly show side';
            shaft.style.cssText = `top: 240px; left: 0; transform: none; width: 100px; height: 12px; bottom: auto; display: block; opacity: 1;`;
            impBottom = 380 - 240 - 6; impLeft = '100px';
        } else { shaft.style.display = 'none'; driveAssembly.className = 'drive-assembly'; }

        if (userChoices.bladeShape) {
            impeller.className = 'impeller show';
            if (userChoices.bladeShape === 'anchor') { impeller.style.height = '150px'; impeller.style.bottom = (impBottom - 72) + 'px'; }
            else if (userChoices.bladeShape === 'screw') { impeller.style.height = '170px'; impeller.style.bottom = (impBottom - 120) + 'px'; }
            else if (userChoices.bladeShape === 'turbine') { impeller.style.height = '92px'; impeller.style.bottom = (impBottom - 46) + 'px'; }
            else { impeller.style.height = '70px'; impeller.style.bottom = (impBottom - 35) + 'px'; }

            impeller.style.left = impLeft;
            
            if (userChoices.bladeShape === 'propeller') impellerSpin.innerHTML = `
                <div class="blade-propeller">
                    <svg class="impeller-svg" viewBox="0 0 220 110" aria-label="三叶推进式螺旋桨">
                        <defs>
                            <linearGradient id="bladeMetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8f9"/><stop offset=".28" stop-color="#bac6cc"/><stop offset=".62" stop-color="#71818b"/><stop offset="1" stop-color="#dce4e8"/></linearGradient>
                            <linearGradient id="bladeDark"><stop stop-color="#73828b"/><stop offset=".55" stop-color="#dce4e8"/><stop offset="1" stop-color="#586771"/></linearGradient>
                            <radialGradient id="hubMetal" cx=".35" cy=".28"><stop stop-color="#f7f9fa"/><stop offset=".45" stop-color="#adb9bf"/><stop offset="1" stop-color="#596872"/></radialGradient>
                            <linearGradient id="darkMetal"><stop stop-color="#d9e1e5"/><stop offset=".5" stop-color="#65747d"/><stop offset="1" stop-color="#aebac0"/></linearGradient>
                        </defs>
                        <g transform="translate(110 57)">
                            <path class="blade-face" d="M-12,-4 C-35,-22 -73,-31 -101,-16 C-77,-8 -50,8 -17,11 C-10,8 -7,2 -12,-4Z"/>
                            <path class="highlight" d="M-91,-16 C-65,-19 -40,-9 -18,2"/>
                            <g transform="rotate(120)">
                                <path class="blade-back" d="M-12,-4 C-35,-22 -73,-31 -101,-16 C-77,-8 -50,8 -17,11 C-10,8 -7,2 -12,-4Z"/>
                                <path class="highlight" d="M-91,-16 C-65,-19 -40,-9 -18,2"/>
                            </g>
                            <g transform="rotate(240)">
                                <path class="blade-face" d="M-12,-4 C-35,-22 -73,-31 -101,-16 C-77,-8 -50,8 -17,11 C-10,8 -7,2 -12,-4Z"/>
                                <path class="highlight" d="M-91,-16 C-65,-19 -40,-9 -18,2"/>
                            </g>
                            <ellipse class="hub" rx="17" ry="15"/>
                            <rect class="shaft-socket" x="-7" y="-25" width="14" height="25" rx="5"/>
                            <ellipse class="highlight" cx="-4" cy="-5" rx="7" ry="6"/>
                        </g>
                    </svg>
                </div>`;
            if (userChoices.bladeShape === 'turbine') impellerSpin.innerHTML = `
                <div class="blade-turbine">
                    <svg class="impeller-svg" viewBox="0 0 230 120" aria-label="六直叶圆盘涡轮">
                        <defs>
                            <linearGradient id="discMetal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4f7f8"/><stop offset=".35" stop-color="#98a6ae"/><stop offset=".62" stop-color="#56656f"/><stop offset="1" stop-color="#c8d2d7"/></linearGradient>
                            <linearGradient id="vaneMetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef3f5"/><stop offset=".42" stop-color="#8998a1"/><stop offset="1" stop-color="#53626c"/></linearGradient>
                            <radialGradient id="hubMetal"><stop stop-color="#f7f9fa"/><stop offset=".5" stop-color="#a9b5bb"/><stop offset="1" stop-color="#596872"/></radialGradient>
                            <linearGradient id="darkMetal"><stop stop-color="#dce4e7"/><stop offset=".55" stop-color="#65747d"/><stop offset="1" stop-color="#aebac0"/></linearGradient>
                        </defs>
                        <g transform="translate(115 63)">
                            <path class="vane" d="M-105,-25 L-63,-19 L-63,19 L-105,25 Z"/><path class="highlight" d="M-98,-19 L-69,-14"/>
                            <path class="vane" d="M105,-25 L63,-19 L63,19 L105,25 Z"/><path class="highlight" d="M70,-14 L98,-19"/>
                            <path class="vane" d="M-70,-49 L-35,-34 L-45,-3 L-85,-13 Z"/><path class="vane" d="M70,-49 L35,-34 L45,-3 L85,-13 Z"/>
                            <path class="vane" d="M-70,49 L-35,34 L-45,3 L-85,13 Z"/><path class="vane" d="M70,49 L35,34 L45,3 L85,13 Z"/>
                            <ellipse class="disc" rx="70" ry="25"/>
                            <ellipse class="highlight" cx="-5" cy="-7" rx="55" ry="13"/>
                            <ellipse class="hub" rx="18" ry="17"/>
                            <rect class="shaft-socket" x="-7" y="-30" width="14" height="30" rx="4"/>
                        </g>
                    </svg>
                </div>`;
            if (userChoices.bladeShape === 'screw') impellerSpin.innerHTML = `
                <div class="blade-screw">
                    <svg class="impeller-svg" viewBox="0 0 220 250" aria-label="双螺带搅拌器">
                        <defs>
                            <linearGradient id="ribbonMetal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#54636d"/><stop offset=".25" stop-color="#eef3f5"/><stop offset=".55" stop-color="#87959e"/><stop offset=".8" stop-color="#f3f6f7"/><stop offset="1" stop-color="#56656e"/></linearGradient>
                            <linearGradient id="darkMetal"><stop stop-color="#e0e6e9"/><stop offset=".5" stop-color="#687780"/><stop offset="1" stop-color="#aeb9bf"/></linearGradient>
                        </defs>
                        <line class="brace" x1="110" y1="20" x2="110" y2="231"/><line class="brace" x1="45" y1="50" x2="175" y2="50"/><line class="brace" x1="42" y1="200" x2="178" y2="200"/>
                        <path class="ribbon-back" d="M48,18 C190,58 190,94 48,126 C-30,145 20,190 174,224"/>
                        <path class="ribbon-front" d="M172,18 C30,58 30,94 172,126 C250,145 200,190 46,224"/>
                        <path class="highlight" d="M166,23 C47,57 43,89 162,120"/>
                        <path class="shadow-line" d="M53,23 C174,59 172,89 60,120"/>
                        <rect class="shaft-socket" x="101" y="5" width="18" height="34" rx="6"/>
                    </svg>
                </div>`;
            if (userChoices.bladeShape === 'anchor') impellerSpin.innerHTML = `
                <div class="blade-anchor">
                    <svg class="impeller-svg" viewBox="0 0 240 190" aria-label="贴壁锚式搅拌器">
                        <defs>
                            <linearGradient id="anchorMetal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#53626c"/><stop offset=".24" stop-color="#e8eef0"/><stop offset=".5" stop-color="#7c8b94"/><stop offset=".76" stop-color="#f3f6f7"/><stop offset="1" stop-color="#53626c"/></linearGradient>
                            <linearGradient id="scraperMetal"><stop stop-color="#f0f4f5"/><stop offset=".45" stop-color="#8b99a1"/><stop offset="1" stop-color="#596872"/></linearGradient>
                            <linearGradient id="darkMetal"><stop stop-color="#dce4e7"/><stop offset=".55" stop-color="#65747d"/><stop offset="1" stop-color="#aebac0"/></linearGradient>
                        </defs>
                        <path class="anchor-frame" d="M35,26 L35,126 Q35,166 77,171 L163,171 Q205,166 205,126 L205,26"/>
                        <path class="anchor-inner" d="M41,31 L41,124 Q41,157 79,163"/><path class="anchor-inner" d="M199,31 L199,124 Q199,157 161,163"/>
                        <line class="anchor-frame" x1="42" y1="38" x2="198" y2="38"/><line class="anchor-frame" x1="120" y1="13" x2="120" y2="164"/>
                        <line class="anchor-frame" x1="54" y1="105" x2="120" y2="83"/><line class="anchor-frame" x1="186" y1="105" x2="120" y2="83"/>
                        <path class="scraper" d="M18,47 L34,42 L34,122 L18,133 Z"/><path class="scraper" d="M222,47 L206,42 L206,122 L222,133 Z"/>
                        <rect class="shaft-socket" x="110" y="1" width="20" height="32" rx="6"/>
                    </svg>
                </div>`;

            let width = 100;
            if (userChoices.diameter === 'small') width = 90; 
            else if (userChoices.diameter === 'medium') width = 180; 
            else if (userChoices.diameter === 'large') width = 240; // 90%左右，贴壁

            impeller.style.width = width + 'px';
            
            if(userChoices.entry === 'side') {
                impeller.style.transform = `translateX(-100%)`;
                impellerSpin.style.transform = `rotateY(90deg)`;
            } else {
                impeller.style.transform = `translateX(-50%)`;
                impellerSpin.style.transform = userChoices.bladeShape === 'propeller'
                    ? `perspective(320px) rotateX(68deg) rotateZ(-12deg)`
                    : `rotateY(0deg)`;
            }
        } else { impeller.className = 'impeller'; }

        liquid.style.height = '80%';
        statusText.textContent = userChoices.bladeShape ? '设备配置中 · 搅拌器已安装' : '设备配置中';
    }

    function startSimulation() {
        const impellerSpin = document.getElementById('impellerSpin');
        const liquid = document.getElementById('liquid');
        const tank = document.getElementById('tank');
        
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('resetBtn').style.display = 'block';
        const materialNames = { free: '自由流场', juice: '果汁高速循环', syrup: '糖浆缓慢翻动', protein: '蛋白液温和混合' };
        document.getElementById('statusText').textContent = '运行中 · ' + materialNames[currentMode];
        liquid.classList.add('running');

        const rotationSpeed = currentMode === 'juice' ? .72 : currentMode === 'syrup' ? 2.8 : currentMode === 'protein' ? 1.9 : 1.5;
        if (userChoices.entry === 'side') {
            impellerSpin.style.animation = `spinSide ${rotationSpeed}s linear infinite`;
        } else if (userChoices.bladeShape === 'propeller') {
            impellerSpin.style.animation = `spinPropellerHorizontal ${rotationSpeed}s linear infinite`;
        } else {
            impellerSpin.style.animation = `spin3D ${rotationSpeed}s linear infinite`;
        }

        tank.querySelectorAll('.particle').forEach(p => p.remove());

        const particleCount = currentMode === 'juice' ? 46 : currentMode === 'syrup' ? 20 : currentMode === 'protein' ? 38 : 30;
        for (let i = 0; i < particleCount; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.style.left = (32 + Math.random() * 36) + '%';
            
            if (userChoices.bladeShape === 'propeller' || userChoices.bladeShape === 'screw') {
                p.style.bottom = (18 + Math.random() * 42) + 'px';
            } else {
                p.style.bottom = (parseInt(impellerSpin.parentElement.style.bottom) + 25 + Math.random() * 24) + 'px';
            }
            
            tank.appendChild(p);
        }

        const particles = tank.querySelectorAll('.particle');

        // 判卷逻辑严格按您的表格
        if (currentMode !== 'free') {
            let isCorrect = false;
            if (currentMode === 'juice') {
                if(userChoices.baffle === 'yes' && userChoices.lid === 'closed' && userChoices.entry === 'top' && userChoices.bladeSize === 'small' && userChoices.bladeShape === 'propeller' && userChoices.diameter === 'small') isCorrect = true; 
            } else if (currentMode === 'syrup') {
                if(userChoices.baffle === 'no' && userChoices.lid === 'closed' && userChoices.entry === 'top' && userChoices.bladeSize === 'large' && (userChoices.bladeShape === 'anchor' || userChoices.bladeShape === 'screw') && (userChoices.diameter === 'medium' || userChoices.diameter === 'large')) isCorrect = true; 
            } else if (currentMode === 'protein') {
                if(userChoices.baffle === 'no' && userChoices.lid === 'closed' && userChoices.entry === 'top-off' && userChoices.bladeSize === 'small' && userChoices.bladeShape === 'propeller' && userChoices.diameter === 'small') isCorrect = true; 
            }

            if (!isCorrect) {
                liquid.style.backgroundColor = 'rgba(239, 68, 68, 0.4)';
                liquid.classList.remove('running');
                particles.forEach((p, index) => {
                    p.style.animation = `wrongSwirl 2s linear infinite`;
                    p.style.animationDelay = (Math.random() * 2) + 's';
                });
                alert("❌ 选型错误！请对照物料特性重新考虑：是否加挡板？进入方式对吗？桨型及大小对吗？");
                return;
            }
        }

        liquid.style.removeProperty('background-color');

        if (currentMode === 'juice') {
            particles.forEach((p) => {
                p.classList.add('juice-pulp');
                p.style.setProperty('--jx1', (Math.random() * 90 - 45) + 'px');
                p.style.setProperty('--jx2', (Math.random() > .5 ? 1 : -1) * (48 + Math.random() * 28) + 'px');
                p.style.setProperty('--jx3', (Math.random() * 70 - 35) + 'px');
                p.style.animation = `juiceCirculation ${1.15 + Math.random() * .55}s cubic-bezier(.45,.05,.55,.95) infinite`;
                p.style.animationDelay = (-Math.random() * 2) + 's';
            });
        } else if (currentMode === 'syrup') {
            particles.forEach((p) => {
                p.classList.add('syrup-strand');
                p.style.setProperty('--sx1', (Math.random() * 75 - 37) + 'px');
                p.style.setProperty('--sx2', (Math.random() > .5 ? 1 : -1) * (35 + Math.random() * 55) + 'px');
                p.style.setProperty('--sx3', (Math.random() * 55 - 27) + 'px');
                p.style.animation = `syrupFold ${3.8 + Math.random() * 2}s ease-in-out infinite`;
                p.style.animationDelay = (-Math.random() * 5) + 's';
            });
        } else if (currentMode === 'protein') {
            particles.forEach((p) => {
                p.classList.add('protein-bubble');
                p.style.setProperty('--bubble-size', (3 + Math.random() * 7) + 'px');
                p.style.setProperty('--px1', (Math.random() * 50 - 25) + 'px');
                p.style.setProperty('--px2', (Math.random() * 80 - 40) + 'px');
                p.style.animation = `proteinBubble ${2.6 + Math.random() * 2.2}s ease-out infinite`;
                p.style.animationDelay = (-Math.random() * 4) + 's';
            });
        } else if (userChoices.bladeShape === 'propeller' || userChoices.bladeShape === 'screw') {
            particles.forEach((p) => {
                p.style.setProperty('--up-x', (Math.random() * 40 - 20) + 'px');
                p.style.setProperty('--down-x', (Math.random() * 100 - 50) + 'px'); 
                p.style.setProperty('--mix-x', (Math.random() * 30 - 15) + 'px'); 
                p.style.animation = `axialFlow ${1.5 + Math.random() * 0.5}s ease-in-out infinite`;
                p.style.animationDelay = (Math.random() * 2) + 's';
            });
        } else if (userChoices.bladeShape === 'turbine' || userChoices.bladeShape === 'anchor') {
            particles.forEach((p) => {
                p.style.setProperty('--out-x', (Math.random() > 0.5 ? 1 : -1) * (60 + Math.random() * 30) + 'px');
                p.style.setProperty('--in-y', (Math.random() > 0.5 ? 1 : -1) * (80 + Math.random() * 40) + 'px');
                p.style.setProperty('--mix-y', (Math.random() > 0.5 ? 1 : -1) * (20 + Math.random() * 10) + 'px'); 
                p.style.animation = `radialFlow ${1.5 + Math.random() * 0.5}s ease-in-out infinite`;
                p.style.animationDelay = (Math.random() * 2) + 's';
            });
        }
    }

    function resetGame() {
        for (let key in userChoices) userChoices[key] = null;
        document.querySelectorAll('.btn-option').forEach(b => b.classList.remove('selected'));
        document.querySelectorAll('#step6 .btn-option').forEach(b => b.disabled = true);
        document.getElementById('tankBody').className = 'tank-body';
        document.getElementById('tankLid').classList.remove('show');
        document.getElementById('baffleL').classList.remove('show');
        document.getElementById('baffleR').classList.remove('show');
        document.getElementById('shaft').style.display = 'none';
        document.getElementById('driveAssembly').className = 'drive-assembly';
        document.getElementById('impeller').className = 'impeller';
        document.getElementById('impellerSpin').style.animation = 'none';
        document.getElementById('impellerSpin').style.transform = 'none';
        document.getElementById('liquid').style.height = '0';
        document.getElementById('liquid').className = 'liquid material-' + currentMode;
        document.getElementById('liquid').style.removeProperty('background-color');
        document.getElementById('liquid').style.borderRadius = '0';
        document.querySelectorAll('.particle').forEach(p => p.remove());
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('resetBtn').style.display = 'none';
        document.getElementById('statusText').textContent = '等待设备选型';
    }
</script>
</body>
</html>
